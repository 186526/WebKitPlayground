name: Build WebKit (iOS device)

on:
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit tag or branch to build'
        required: true
        default: 'releases/Apple/Safari-18.3.1-iOS-18.3.2'
      apply_patch:
        description: 'Apply the worktree patch (only known-good for 16.1-16.5 tags)'
        required: true
        default: 'false'
      xcode:
        description: 'Xcode app bundle name'
        required: true
        default: 'Xcode_16.4'

jobs:
  build:
    name: Fetch, patch, build
    runs-on: macos-15
    timeout-minutes: 350
    env:
      # Single source of truth for the shipped minos: the Build step passes this as
      # IPHONEOS_DEPLOYMENT_TARGET, and the additions-SDK step derives the directory name
      # WebKitProjectPaths.xcconfig:98 builds from it. Two literals would let a future target
      # change leave the pre-build assertion checking a path the build no longer reads.
      WK_BUILD_DEPLOYMENT_TARGET: '16.1'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/${{ inputs.xcode }}.app"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Measure disk before clone
        run: df -h /

      - name: Free runner disk
        run: |
          set -euo pipefail
          # actool reaches into iPhoneSimulator.platform for its CARCompiler overlay tool, so that
          # platform must stay. Dropping it makes ibtoold abort inside
          # +[IBICSimulatorToolCARCompiler catalogToolForPlatformWithIdentifier:...] and takes
          # CompileAssetCatalogVariant down with it.
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XROS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XRSimulator.platform || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          df -h /

      - name: Install ccache
        run: |
          set -euo pipefail
          command -v ccache || brew install ccache
          ccache --version | head -1
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # base_dir strips the per-run checkout prefix from the hashed file paths.
          echo "CCACHE_BASEDIR=/Users/runner/work" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros" >> "$GITHUB_ENV"
          # GitHub keeps at most 10 GiB of caches per repository, so 6 GiB leaves room
          # for one previous generation while staying under the quota.
          echo "CCACHE_MAXSIZE=6G" >> "$GITHUB_ENV"

      - name: Configure ccache
        run: |
          set -euo pipefail
          # A native ccache binary reads neither CCACHE_NOHASHDIR nor CCACHE_SLOPPINESS.
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros
          ccache --set-config=max_size=6G
          ccache --set-config=base_dir=/Users/runner/work
          # ccache stores each entry with zstd; level 6 keeps most of level 19's saving
          # without spending build time on maximum compression.
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -p | grep -E 'cache_dir|base_dir|hash_dir|compiler_check|sloppiness|max_size|compression'

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          # Exact per-run key so every run saves its own cache; restores from the newest prefix match.
          key: ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-
            ccache-${{ inputs.webkit_ref }}-

      - name: Fetch WebKit source
        run: |
          set -euo pipefail
          time git clone --depth 1 --single-branch \
            --branch '${{ inputs.webkit_ref }}' \
            https://github.com/WebKit/WebKit.git WebKit
          cd WebKit
          git log -1 --format='%H %ad %s'
          grep -E '^(MAJOR|MINOR|TINY)_VERSION' Configurations/Version.xcconfig || \
            grep -E '^(MAJOR|MINOR|TINY)_VERSION' Source/WebKit/Configurations/Version.xcconfig || true
          du -sh .git
          df -h /

      - name: Link the additions SDK the deployment target derives
        run: |
          set -euo pipefail
          # Configurations/WebKitProjectPaths.xcconfig:98 turns the deployment target into the
          # additions-SDK directory name:
          #
          #   WK_VERSIONED_SDK_ADDITIONS_PATH_ = $(WK_WORKSPACE_DIR)/WebKitLibraries/SDKs/$(PLATFORM_NAME)$($(DEPLOYMENT_TARGET_SETTING_NAME):base:base).0-additions.sdk
          #
          # With IPHONEOS_DEPLOYMENT_TARGET=16.1 that is WebKitLibraries/SDKs/iphoneos16.0-additions.sdk.
          # At tag Safari-18.3.1-iOS-18.3.2 WebKitLibraries/SDKs holds only iphoneos17.0-additions.sdk and
          # iphoneos18.0-additions.sdk, so the derived directory is missing. A missing directory is not
          # an error: Configurations/SDKAdditions.xcconfig:35-39 still puts the path in ADDITIONAL_SDKS
          # (Source/WebKit/Configurations/Base.xcconfig:111), xcodebuild degrades it to
          # "warning: can't find additional SDK", no -isystem reaches the compiler, and the compile dies
          # inside Source/JavaScriptCore/API/JSWrapperMap.h:28 on <objc/objc-runtime.h>. That header is
          # one of the symlinks WebKitLibraries/SDKs/iphoneos18.0-additions.sdk/SymlinkedHeaders.xcfilelist
          # creates into $(WK_DERIVED_SDK_HEADERS_DIR)/usr/include from $(SDK_DIR_macosx)/usr/include/objc/.
          #
          # So the 18.0 tree supplies headers and stub libraries while IPHONEOS_DEPLOYMENT_TARGET stays
          # 16.1 and keeps setting the shipped minos. The symlink below is the load-bearing fix: the
          # derived name then resolves for every target that reads WK_ADDITIONAL_SDKS, with no dependence
          # on build-setting precedence. It exists only in the runner's clone, never in the repository.
          additions_tree=iphoneos18.0-additions.sdk
          deployment_target=$WK_BUILD_DEPLOYMENT_TARGET
          derived_name="iphoneos${deployment_target%%.*}.0-additions.sdk"
          sdk_root="$GITHUB_WORKSPACE/WebKit/WebKitLibraries/SDKs"

          assert_additions_sdk() {
            local path=$1 what=$2
            if [ ! -d "$path" ]; then
              echo "::error::missing additions SDK for IPHONEOS_DEPLOYMENT_TARGET=${deployment_target}: looked for ${path} (${what})"
              echo "WebKitLibraries/SDKs at this ref contains:"
              ls -1 "$sdk_root" 2>/dev/null || true
              exit 1
            fi
            if [ ! -d "$path/usr/local/include" ]; then
              echo "::error::additions SDK at ${path} (${what}) has no usr/local/include, so the objc headers cannot be produced"
              exit 1
            fi
          }

          assert_additions_sdk "$sdk_root/$additions_tree" "18.0 tree used as the link target"
          # -d follows symlinks, so an existing derived path that does not resolve lands here as a
          # dangling link rather than as a confusing ln failure; -L catches the dangling case, for
          # which test -e is false.
          if [ ! -d "$sdk_root/$derived_name" ] && { [ -e "$sdk_root/$derived_name" ] || [ -L "$sdk_root/$derived_name" ]; }; then
            echo "::error::${sdk_root}/${derived_name} exists but does not resolve to a directory"
            ls -l "$sdk_root/$derived_name"
            exit 1
          fi
          if [ "$derived_name" = "$additions_tree" ] || [ -d "$sdk_root/$derived_name" ]; then
            echo "derived additions SDK already present: $sdk_root/$derived_name"
          else
            ln -s "$additions_tree" "$sdk_root/$derived_name"
            echo "linked $sdk_root/$derived_name -> $additions_tree"
          fi
          assert_additions_sdk "$sdk_root/$derived_name" "derived path the build reads"
          if grep -qxF '$(SDK_DIR_macosx)/usr/include/objc/objc-runtime.h' \
              "$sdk_root/$derived_name/SymlinkedHeaders.xcfilelist"; then
            echo "objc/objc-runtime.h is listed in SymlinkedHeaders.xcfilelist"
          else
            echo "::warning::SymlinkedHeaders.xcfilelist under $derived_name does not list objc/objc-runtime.h"
          fi
          # The Build step names the same directory a second way, as a build setting rather than a
          # symlink; the path is computed from the clone so no runner-specific prefix is hardcoded.
          echo "WK_ADDITIONS_SDK_PATH=$sdk_root/$additions_tree" >> "$GITHUB_ENV"

      - name: Copy ABI shims
        run: |
          set -euo pipefail
          cp -R scripts WebKit/

      - name: Apply worktree patch
        if: inputs.apply_patch == 'true'
        env:
          WEBKIT_REF: ${{ inputs.webkit_ref }}
        run: |
          set -euo pipefail
          pwd
          ls -d patches scripts WebKit
          # patches/ios18-public-sdk-libpas-ulock-flags.patch guards PAS_USE_ULOCK_FLAGS_API,
          # which does not exist before tag Safari-18.2, so on an older ref the patch cannot
          # apply and a skip there is correct rather than stale.
          ref_needs_ulock_flags_api=0
          ref_name="${WEBKIT_REF##*/}"
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2; minor = $3 }
              END {
                  if (major == "" || minor == "") exit 1
                  exit !((major + 0) > 18 || ((major + 0) == 18 && (minor + 0) >= 2))
              }' <<< "${ref_name}"; then
            ref_needs_ulock_flags_api=1
          fi
          echo "PAS_USE_ULOCK_FLAGS_API present in ${WEBKIT_REF}: ${ref_needs_ulock_flags_api}"
          for p in patches/*.patch; do
            test -f "$p" || { echo "MISSING PATCH FILE: $p"; exit 1; }
            echo "== $p"
            # 16.x worktree patches only match their own tag. The ios18-public-sdk patches fix
            # missing guards that affect every tag built against the public iOS SDK, so a skip there
            # means the patch is stale and the build would fail 90 minutes later.
            if ! git -C WebKit apply --check -v "$PWD/$p"; then
              case "$(basename "$p")" in
                ios18-public-sdk-libpas-ulock-flags.patch)
                  if [ "$ref_needs_ulock_flags_api" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-*)
                  echo "REQUIRED PATCH DOES NOT APPLY: $p"
                  exit 1
                  ;;
              esac
              echo "SKIP (does not apply to ${WEBKIT_REF}): $p"
              continue
            fi
            git -C WebKit apply -v "$PWD/$p"
            echo "APPLIED: $p"
          done

      - name: Configure embedded development
        run: sudo WebKit/Tools/Scripts/configure-xcode-for-embedded-development || true

      - name: Probe actool
        continue-on-error: true
        run: |
          set -uo pipefail
          actool=/Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool
          src="$PWD/WebKit/Source/WebKit"
          out="$RUNNER_TEMP/actool-real"
          rm -rf "$out"
          mkdir -p "$out"
          echo "== help excerpt for export options"
          "$actool" --help 2>&1 | grep -iE "export|depend|thin|symbol" | head -20 || true
          echo "== without the xcodebuild-only flags"
          "$actool" \
            "$src/HTTPSBrowsingWarning.xcassets" \
            "$src/Resources/ios/iOS.xcassets" \
            "$src/Resources/SafeBrowsing.xcassets" \
            --compile "$out" \
            --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist "$RUNNER_TEMP/actool-real.plist" \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device iphone \
            --minimum-deployment-target 18.5 \
            --platform iphoneos
          echo "actool real exit: $?"
          ls "$out" | head

      - name: Build
        run: |
          set -uo pipefail
          cd WebKit
          # build-webkit drives xcodebuild directly, so IDE defaults do not reach it; Xcode's own
          # scheduling already spreads work across ~3 cores natively.
          echo "ccache statistics before build:"
          ccache -s || true
          # Independent sampler: survives whatever kills the build shell.
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          sampler="$GITHUB_WORKSPACE/diagnostics/samples.log"
          ( while true; do
              printf '%s ' "$(date -u +%FT%TZ)"
              sysctl -n vm.swapusage 2>/dev/null | tr '\n' ' '
              printf 'procs=%s ' "$(ps -Ao rss -r 2>/dev/null | awk 'NR>1{s+=$1} END{print s+0}')"
              printf 'top=%s\n' "$(ps -Ao rss,comm -r 2>/dev/null | sed -n 2p | tr ' ' '_')"
              sleep 15
            done ) > "$sampler" 2>&1 &
          sampler_pid=$!
          echo "sampler pid ${sampler_pid}"
          status=0
          # The device deb must load on iOS 16.1, so every shipped binary has to be built
          # for 16.1 against the 18.5 SDK. Without IPHONEOS_DEPLOYMENT_TARGET the SDK's own
          # minimum leaks into LC_BUILD_VERSION, and dyld then refuses the framework with
          # "built for iOS 18.5 which is newer than running OS".
          #
          # Source/WebKit/Configurations/WebKit.xcconfig:227-244 is where the 18.5-SDK build
          # decides to link BrowserEngineKit strongly and WritingTools weakly; blanking both
          # keys removes those -framework flags. Blanking the flags alone is not enough:
          # Source/WTF/wtf/PlatformUse.h:411-417 turns the two USE macros on from
          # __IPHONE_OS_VERSION_MAX_ALLOWED >= 170400 and __has_include(<BrowserEngineKit/...>),
          # both of which still hold under an 18.5 SDK, so the -D...=0 defines close the
          # gate. Source/WTF/wtf/PlatformHave.h:1717-1724 wraps
          # HAVE_BROWSER_ENGINE_SUPPORTING_API in !defined(), so the command-line define wins
          # over the 170400 SDK check there as well.
          #
          # WK_VERSIONED_SDK_ADDITIONS_PATH is the second half of the additions-SDK fix, alongside
          # the iphoneos16.0 -> iphoneos18.0 symlink in the step above. Configurations/
          # WebKitProjectPaths.xcconfig:97 sets that key from WK_VERSIONED_SDK_ADDITIONS_PATH_$(USE_INTERNAL_SDK),
          # and Configurations/SDKAdditions.xcconfig:35-39 copies it into WK_ADDITIONAL_SDKS, which
          # Source/WebKit/Configurations/Base.xcconfig:111 renames to ADDITIONAL_SDKS. build-webkit
          # hands every KEY=VALUE argument to xcodebuild unchanged (Tools/Scripts/build-webkit:370-381
          # pass @ARGV into buildXcodeScheme / buildXCodeProject, and Tools/Scripts/webkitdirs.pm:2358,2368
          # pass them on as xcodebuild arguments), and a command-line setting beats the xcconfig that
          # assigns it. So this key pins the path even if a future ref stops naming the directory after
          # the deployment target. The symlink alone would be enough; this makes the intent explicit.
          Tools/Scripts/build-webkit --ios-device --release --use-ccache \
            WK_USE_CCACHE=YES \
            ARCHS='arm64e' \
            IPHONEOS_DEPLOYMENT_TARGET="$WK_BUILD_DEPLOYMENT_TARGET" \
            WK_VERSIONED_SDK_ADDITIONS_PATH="$WK_ADDITIONS_SDK_PATH" \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error -DUSE_BROWSERENGINEKIT=0 -DUSE_EXTENSIONKIT=0 -DHAVE_BROWSER_ENGINE_SUPPORTING_API=0' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-error -DUSE_BROWSERENGINEKIT=0 -DUSE_EXTENSIONKIT=0 -DHAVE_BROWSER_ENGINE_SUPPORTING_API=0' \
            WK_BROWSERENGINEKIT_LDFLAGS= \
            WK_WRITING_TOOLS_LDFLAGS_iphoneos= \
            COMPRESS_PNG_FILES=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            WK_ROOTLESS_FRAMEWORKS=YES > "$GITHUB_WORKSPACE/diagnostics/build.log" 2>&1 || status=$?
          echo "build-webkit exited with status ${status}"
          kill "$sampler_pid" 2>/dev/null || true
          echo "ccache statistics after build:"
          ccache -s || true
          if [ "$status" -ne 0 ]; then
            echo "=== last 60 lines of build output"
            tail -60 "$GITHUB_WORKSPACE/diagnostics/build.log" || true
            echo "=== memory"
            sysctl -n hw.memsize vm.swapusage 2>/dev/null || true
            vm_stat 2>/dev/null | head -12 || true
            ps -Ao rss,comm -r 2>/dev/null | head -15 || true
            echo "=== sampler tail"
            tail -20 "$sampler" || true
            echo "=== actool probe"
            /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool --version --output-format xml1 || true
          fi
          exit "$status"

      - name: Assert iOS 16.1 deployment gates
        if: success()
        run: |
          set -euo pipefail
          # Fails the job when a shipped binary asks for a newer minos than 16.1 or still
          # carries a BrowserEngineKit load command, so a gate regression cannot turn into
          # another deb that dyld refuses to load on the device.
          zsh scripts/check-ios-deployment-gates.sh \
            --build-dir "$PWD/WebKit/WebKitBuild/Release-iphoneos" \
            --max-minos 16.1

      - name: Report ccache compression
        if: always()
        run: |
          ccache --show-compression || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Inspect build output
        if: always()
        run: |
          set -uo pipefail
          df -h /
          du -sh WebKit/WebKitBuild 2>/dev/null || true
          ls -la WebKit/WebKitBuild/Release-iphoneos 2>/dev/null | head -40 || echo "no Release-iphoneos"
          echo "=== link commands carrying -dyld_env"
          found=0
          while IFS= read -r f; do
            if grep -q 'dyld_env' "$f"; then
              echo "LINKFLAG: $f"
              found=1
            fi
          done < <(find WebKit/WebKitBuild/Release-iphoneos -name '*.LinkFileList' 2>/dev/null)
          if [ "$found" = 0 ]; then
            echo "no LinkFileList mentions dyld_env"
          fi
          echo "=== XPC services carrying an LC_DYLD_ENVIRONMENT load command"
          for b in WebKit/WebKitBuild/Release-iphoneos/*.xpc/* WebKit/WebKitBuild/Release-iphoneos/WebKit.framework/XPCServices/*.xpc/*; do
            [ -f "$b" ] || continue
            if otool -l "$b" 2>/dev/null | grep -q 'cmd LC_DYLD_ENVIRONMENT'; then
              echo "DYLD_ENV FOUND: $b"
              otool -l "$b" 2>/dev/null | grep -A3 'cmd LC_DYLD_ENVIRONMENT' | sed 's/^/    /'
            fi
          done
          echo "=== end of inspection"

      - name: Prune build intermediates
        if: always()
        run: |
          set -euo pipefail
          # Crash reports explain a silent kill; upload them out of the VM before it goes away.
          mkdir -p diagnostics
          cp -R ~/Library/Logs/DiagnosticReports diagnostics/ 2>/dev/null || true
          du -sh WebKit/WebKitBuild/*.build 2>/dev/null | sort -h | tail -10 || true
          rm -rf WebKit/WebKitBuild/*.build 2>/dev/null || true
          df -h /

      - name: Install packaging tools
        if: success()
        run: |
          set -euo pipefail
          brew install ldid dpkg || true
          command -v ldid && command -v dpkg-deb

      - name: Package rootless deb
        if: success()
        run: |
          set -euo pipefail
          zsh scripts/package-webkit-device-deb.sh \
            --product "$PWD/WebKit/WebKitBuild/Release-iphoneos" \
            --rootless \
            --output "$PWD/packages/webkit-rootless.deb"
          ls -lh packages/

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-rootless-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
