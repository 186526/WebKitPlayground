name: Build WebKit (iOS device)

on:
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit tag or branch to build'
        required: true
        default: 'releases/Apple/Safari-18.3.1-iOS-18.3.2'
      apply_patch:
        description: 'Apply the worktree patch (only known-good for 16.1-16.5 tags)'
        required: true
        default: 'false'
      xcode:
        description: 'Xcode app bundle name'
        required: true
        default: 'Xcode_16.4'

jobs:
  build:
    name: Fetch, patch, build
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/${{ inputs.xcode }}.app"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Measure disk before clone
        run: df -h /

      - name: Free runner disk
        run: |
          set -euo pipefail
          # Xcode ships simulator runtimes and device support packs that an iOS device build never touches.
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/iPhoneSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XROS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XRSimulator.platform || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          df -h /

      - name: Install ccache
        run: |
          set -euo pipefail
          command -v ccache || brew install ccache
          ccache --version | head -1
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # base_dir strips the per-run checkout prefix from the hashed file paths.
          echo "CCACHE_BASEDIR=/Users/runner/work" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"

      - name: Configure ccache
        run: |
          set -euo pipefail
          # A native ccache binary reads neither CCACHE_NOHASHDIR nor CCACHE_SLOPPINESS.
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros
          ccache --set-config=max_size=3G
          ccache --set-config=base_dir=/Users/runner/work
          ccache -p | grep -E 'cache_dir|base_dir|hash_dir|compiler_check|sloppiness|max_size'

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          # Exact per-run key so every run saves its own cache; restores from the newest prefix match.
          key: ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-
            ccache-${{ inputs.webkit_ref }}-

      - name: Fetch WebKit source
        run: |
          set -euo pipefail
          time git clone --depth 1 --single-branch \
            --branch '${{ inputs.webkit_ref }}' \
            https://github.com/WebKit/WebKit.git WebKit
          cd WebKit
          git log -1 --format='%H %ad %s'
          grep -E '^(MAJOR|MINOR|TINY)_VERSION' Configurations/Version.xcconfig || \
            grep -E '^(MAJOR|MINOR|TINY)_VERSION' Source/WebKit/Configurations/Version.xcconfig || true
          du -sh .git
          df -h /

      - name: Copy ABI shims
        run: |
          set -euo pipefail
          cp -R scripts WebKit/

      - name: Apply worktree patch
        if: inputs.apply_patch == 'true'
        env:
          WEBKIT_REF: ${{ inputs.webkit_ref }}
        run: |
          set -euo pipefail
          pwd
          ls -d patches scripts WebKit
          for p in patches/*.patch; do
            test -f "$p" || { echo "MISSING PATCH FILE: $p"; exit 1; }
            echo "== $p"
            # 16.x worktree patches only match their own tag. The ios18-public-sdk patches fix
            # missing guards that affect every tag built against the public iOS SDK, so a skip there
            # means the patch is stale and the build would fail 90 minutes later.
            if ! git -C WebKit apply --check -v "$PWD/$p"; then
              case "$(basename "$p")" in
                ios18-public-sdk-*)
                  echo "REQUIRED PATCH DOES NOT APPLY: $p"
                  exit 1
                  ;;
              esac
              echo "SKIP (does not apply to ${WEBKIT_REF}): $p"
              continue
            fi
            git -C WebKit apply -v "$PWD/$p"
            echo "APPLIED: $p"
          done

      - name: Configure embedded development
        run: sudo WebKit/Tools/Scripts/configure-xcode-for-embedded-development || true

      - name: Probe actool
        continue-on-error: true
        run: |
          set -uo pipefail
          probe="$RUNNER_TEMP/actool-probe"
          rm -rf "$probe"
          mkdir -p "$probe/Test.imageset"
          printf '{"images":[{"idiom":"universal","filename":"x.pdf"}],"info":{"version":1,"author":"xcode"}}' > "$probe/Test.imageset/Contents.json"
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 10 10]>>endobj\ntrailer<</Root 1 0 R>>\n%%%%EOF\n' > "$probe/Test.imageset/x.pdf"
          actool=/Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool
          mkdir -p "$RUNNER_TEMP/actool-out-a" "$RUNNER_TEMP/actool-out-b"
          echo "== A: no bundle identifier (same shape as CompileAssetCatalogVariant)"
          "$actool" "$probe" --compile "$RUNNER_TEMP/actool-out-a" --output-format human-readable-text --notices --warnings --target-device iphone --minimum-deployment-target 18.5 --platform iphoneos --output-partial-info-plist "$RUNNER_TEMP/actool-a.plist"
          echo "actool A exit: $?"
          echo "== B: with bundle identifier (same shape as GenerateAssetSymbols)"
          "$actool" "$probe" --compile "$RUNNER_TEMP/actool-out-b" --output-format human-readable-text --notices --warnings --target-device iphone --minimum-deployment-target 18.5 --platform iphoneos --bundle-identifier com.apple.WebKit --output-partial-info-plist "$RUNNER_TEMP/actool-b.plist"
          echo "actool B exit: $?"

      - name: Build
        run: |
          set -uo pipefail
          cd WebKit
          # build-webkit drives xcodebuild directly, so IDE defaults do not reach it; Xcode's own
          # scheduling already spreads work across ~3 cores natively.
          echo "ccache statistics before build:"
          ccache -s || true
          # Independent sampler: survives whatever kills the build shell.
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          sampler="$GITHUB_WORKSPACE/diagnostics/samples.log"
          ( while true; do
              printf '%s ' "$(date -u +%FT%TZ)"
              sysctl -n vm.swapusage 2>/dev/null | tr '\n' ' '
              printf 'procs=%s ' "$(ps -Ao rss -r 2>/dev/null | awk 'NR>1{s+=$1} END{print s+0}')"
              printf 'top=%s\n' "$(ps -Ao rss,comm -r 2>/dev/null | sed -n 2p | tr ' ' '_')"
              sleep 15
            done ) > "$sampler" 2>&1 &
          sampler_pid=$!
          echo "sampler pid ${sampler_pid}"
          status=0
          Tools/Scripts/build-webkit --ios-device --release --use-ccache \
            WK_USE_CCACHE=YES \
            ARCHS='arm64e' \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-error' \
            COMPRESS_PNG_FILES=NO \
            DEBUG_INFORMATION_FORMAT=dwarf > "$GITHUB_WORKSPACE/diagnostics/build.log" 2>&1 || status=$?
          echo "build-webkit exited with status ${status}"
          kill "$sampler_pid" 2>/dev/null || true
          echo "ccache statistics after build:"
          ccache -s || true
          if [ "$status" -ne 0 ]; then
            echo "=== last 60 lines of build output"
            tail -60 "$GITHUB_WORKSPACE/diagnostics/build.log" || true
            echo "=== memory"
            sysctl -n hw.memsize vm.swapusage 2>/dev/null || true
            vm_stat 2>/dev/null | head -12 || true
            ps -Ao rss,comm -r 2>/dev/null | head -15 || true
            echo "=== sampler tail"
            tail -20 "$sampler" || true
            echo "=== actool probe"
            /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool --version --output-format xml1 || true
          fi
          exit "$status"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Inspect build output
        if: always()
        run: |
          df -h /
          du -sh WebKit/WebKitBuild 2>/dev/null || true
          ls -la WebKit/WebKitBuild/Release-iphoneos 2>/dev/null | head -40 || echo "no Release-iphoneos"

      - name: Prune build intermediates
        if: always()
        run: |
          set -euo pipefail
          # Crash reports explain a silent kill; upload them out of the VM before it goes away.
          mkdir -p diagnostics
          cp -R ~/Library/Logs/DiagnosticReports diagnostics/ 2>/dev/null || true
          du -sh WebKit/WebKitBuild/*.build 2>/dev/null | sort -h | tail -10 || true
          rm -rf WebKit/WebKitBuild/*.build 2>/dev/null || true
          df -h /

      - name: Install packaging tools
        if: success()
        run: |
          set -euo pipefail
          brew install ldid dpkg || true
          command -v ldid && command -v dpkg-deb

      - name: Package rootless deb
        if: success()
        run: |
          set -euo pipefail
          zsh scripts/package-webkit-device-deb.sh \
            --product "$PWD/WebKit/WebKitBuild/Release-iphoneos" \
            --rootless \
            --output "$PWD/packages/webkit-rootless.deb"
          ls -lh packages/

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-rootless-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
