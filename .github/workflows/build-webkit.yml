name: Build WebKit (iOS device)

on:
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit tag or branch to build'
        required: true
        default: 'releases/Apple/Safari-18.3.1-iOS-18.3.2'
      apply_patch:
        description: 'Apply the worktree patch (only known-good for 16.1-16.5 tags)'
        required: true
        default: 'false'
      xcode:
        description: 'Xcode app bundle name'
        required: true
        default: 'Xcode_16.4'

jobs:
  build:
    name: Fetch, patch, build
    runs-on: macos-15
    timeout-minutes: 350
    env:
      # Single source of truth for the shipped minos: the Build step passes this as
      # IPHONEOS_DEPLOYMENT_TARGET, and the additions-SDK step derives the directory name
      # WebKitProjectPaths.xcconfig:98 builds from it. Two literals would let a future target
      # change leave the pre-build assertion checking a path the build no longer reads.
      WK_BUILD_DEPLOYMENT_TARGET: '16.1'
      # patches/ios18-public-sdk-extensionkit-extension-exclusion.patch makes BaseExtension.xcconfig
      # read this switch and, when it is YES, exclude every source and blank the bridging header of
      # the four ExtensionKit targets (WebContentExtension, WebContentCaptivePortalExtension,
      # NetworkingExtension, GPUExtension). Those targets conform to BrowserEngineKit protocols whose
      # configuration property is API_AVAILABLE(ios(17.4)). Swift evaluates that availability against
      # IPHONEOS_DEPLOYMENT_TARGET, and no -D can turn it off, so at 16.1 an unswitched build cannot
      # compile WebContentProcessExtension.swift (build.log:267936, :267969) or
      # NetworkingProcessExtension.swift (:268002). GPUExtension raised no availability diagnostic,
      # but it did not pass either: it is in the failure list with "SwiftGeneratePch ... Compiling
      # bridging header" (:268012-268013), which is why the switch has to cover both settings.
      # Upstream pairs them in every platform and SDK state it excludes, and never ships a
      # zero-source target that still names a bridging header. Upstream already excludes these
      # targets by SDK version; this extends the same idea to the 18.5 SDK, which it does not cover.
      # Nothing is lost from the deb: none of the four Extension bundles appears in
      # scripts/package-webkit-device-deb.sh's required, recommended or on-demand lists, and the
      # device loads the four XPC services instead.
      WK_EXTENSIONKIT_EXTENSIONS_EXCLUDED: 'YES'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/${{ inputs.xcode }}.app"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Measure disk before clone
        run: df -h /

      - name: Free runner disk
        run: |
          set -euo pipefail
          # actool reaches into iPhoneSimulator.platform for its CARCompiler overlay tool, so that
          # platform must stay. Dropping it makes ibtoold abort inside
          # +[IBICSimulatorToolCARCompiler catalogToolForPlatformWithIdentifier:...] and takes
          # CompileAssetCatalogVariant down with it.
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XROS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/XRSimulator.platform || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          df -h /

      - name: Install ccache
        run: |
          set -euo pipefail
          command -v ccache || brew install ccache
          ccache --version | head -1
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # base_dir strips the per-run checkout prefix from the hashed file paths.
          echo "CCACHE_BASEDIR=/Users/runner/work" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros" >> "$GITHUB_ENV"
          # One generation of this build does not fit in 6 GB. Run 45078008945 ended with the
          # cache 100.9% full and raised Cleanups from 19,811 to 20,307 (ccache -s), so ccache
          # trimmed 496 times during one build, dropping entries that build was about to ask for
          # again. Only 50.2% of that build's cacheable calls hit (the Cleanups and Hits deltas
          # over that run), and the two runs before it built the same WebKit commit
          # 1b670a0c with an in-run hit rate of 53.1%, so the trimming rather than a source
          # change is what caps the hit rate.
          # The working set is larger than one entry can hold, but its size is not measured:
          # --show-compression counts only the entries still in the cache, so its 33.7 GB
          # original size stops at the 6.1 GB that survived the trimming and cannot be divided
          # back into the trimmed entries. What sets 10G is the archive limit instead:
          # @actions/cache rejects an archive over 10 GiB (CacheFileSizeLimit in the toolkit
          # constants, and "is over the 10GB limit, not saving cache" in cache.ts). A decimal
          # 10G is 10,000,000,000 B, so it stays under that limit even at the 100.9% overshoot
          # seen above, and it is the largest limit whose entry always saves. The part of the
          # working set that still does not fit is trimmed as before; the capacity report
          # before the save measures how much trimming is left.
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"

      - name: Configure ccache
        run: |
          set -euo pipefail
          # A native ccache binary reads neither CCACHE_NOHASHDIR nor CCACHE_SLOPPINESS.
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros
          # Same value as CCACHE_MAXSIZE above, which overrides the restored ccache.conf for
          # every ccache invocation in this job. Writing it here too makes the saved cache
          # carry the new limit instead of the 6G the restored one was written with.
          ccache --set-config=max_size=10G
          ccache --set-config=base_dir=/Users/runner/work
          # ccache stores each entry with zstd; level 6 keeps most of level 19's saving
          # without spending build time on maximum compression.
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -p | grep -E 'cache_dir|base_dir|hash_dir|compiler_check|sloppiness|max_size|compression'

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          # Exact per-run key so every run saves its own cache; restores from the newest prefix match.
          key: ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.webkit_ref }}-${{ inputs.xcode }}-
            ccache-${{ inputs.webkit_ref }}-

      - name: Fetch WebKit source
        run: |
          set -euo pipefail
          time git clone --depth 1 --single-branch \
            --branch '${{ inputs.webkit_ref }}' \
            https://github.com/WebKit/WebKit.git WebKit
          cd WebKit
          git log -1 --format='%H %ad %s'
          grep -E '^(MAJOR|MINOR|TINY)_VERSION' Configurations/Version.xcconfig || \
            grep -E '^(MAJOR|MINOR|TINY)_VERSION' Source/WebKit/Configurations/Version.xcconfig || true
          du -sh .git
          df -h /

      - name: Refuse a build that would ship XPC services iOS never selects
        env:
          APPLY_PATCH: ${{ inputs.apply_patch }}
        run: |
          set -euo pipefail
          # patches/ios16-xpc-service-bundle-identifier.patch is only applied when apply_patch is
          # true, and the packaged-deb assertion at the end of the job fails on any bundle whose
          # CFBundleIdentifier still carries the .Service suffix. Left alone, an unpatched run is
          # the worst outcome: it compiles for about 5 hours, fails that assertion, and Upload deb
          # is skipped too, so the run produces no package. This guard turns that into a few
          # seconds by stating the requirement once the sources exist and before the build starts.
          #
          # The clone above is unavoidable: the decision is made by reading the three xcconfigs,
          # and they do not exist until it finishes. What this still saves is the build.
          #
          # The files are read rather than the ref name. The .Service gate is not in every tag:
          # 16.1, 16.4, 16.6, 17.0, 17.2, 17.3.1, 17.5 and 17.6 have no sdk=iphone* identifier
          # line at all, and 17.4 keys it on sdk=iphonesimulator*. Those refs already name the
          # services the way iOS asks for them, so apply_patch=false is correct there and this
          # guard passes them through. Reading the files is what keeps a re-tagged or unusual ref
          # correct, and it is the same test the Apply worktree patch step uses.
          configurations=WebKit/Source/WebKit/Configurations
          if [ ! -d "$configurations" ]; then
            echo "::error::${configurations} is missing, so the XPC service identifier check cannot decide"
            exit 1
          fi
          if [ "$APPLY_PATCH" = "true" ]; then
            echo "apply_patch is true, so the XPC service identifier patch is in place"
            exit 0
          fi
          gated=""
          for service in WebContentService NetworkService GPUService; do
            xcconfig="${configurations}/${service}.xcconfig"
            if [ ! -f "$xcconfig" ]; then
              echo "::error::${xcconfig} is missing, so the XPC service identifier check cannot decide"
              exit 1
            fi
            if grep -qF 'PRODUCT_BUNDLE_IDENTIFIER[sdk=iphone*] = $(PRODUCT_NAME).Service;' "$xcconfig"; then
              gated="${gated} ${xcconfig}"
            fi
          done
          if [ -n "$gated" ]; then
            for xcconfig in $gated; do
              echo "::error::apply_patch is false but ${xcconfig} still sets PRODUCT_BUNDLE_IDENTIFIER[sdk=iphone*] = \$(PRODUCT_NAME).Service."
            done
            echo "::error::An 18.x SDK at a 16.1 deployment target takes that line, so the package would register its services as com.apple.WebKit.WebContent.Service and friends. Source/WebKit/UIProcess/Launcher/cocoa/ProcessLauncherCocoa.mm:190-212 asks for com.apple.WebKit.WebContent with no suffix, so the system would never select them and the build would be wasted."
            echo "::error::Set apply_patch to true."
            exit 1
          fi
          echo "${configurations} has no sdk=iphone* .Service gate at this ref, so this ref needs no patch"

      - name: Link the additions SDK the deployment target derives
        run: |
          set -euo pipefail
          # Configurations/WebKitProjectPaths.xcconfig:98 turns the deployment target into the
          # additions-SDK directory name:
          #
          #   WK_VERSIONED_SDK_ADDITIONS_PATH_ = $(WK_WORKSPACE_DIR)/WebKitLibraries/SDKs/$(PLATFORM_NAME)$($(DEPLOYMENT_TARGET_SETTING_NAME):base:base).0-additions.sdk
          #
          # With IPHONEOS_DEPLOYMENT_TARGET=16.1 that is WebKitLibraries/SDKs/iphoneos16.0-additions.sdk.
          # At tag Safari-18.3.1-iOS-18.3.2 WebKitLibraries/SDKs holds only iphoneos17.0-additions.sdk and
          # iphoneos18.0-additions.sdk, so the derived directory is missing. A missing directory is not
          # an error: Configurations/SDKAdditions.xcconfig:35-39 still puts the path in ADDITIONAL_SDKS
          # (Source/WebKit/Configurations/Base.xcconfig:111), xcodebuild degrades it to
          # "warning: can't find additional SDK", no -isystem reaches the compiler, and the compile dies
          # inside Source/JavaScriptCore/API/JSWrapperMap.h:28 on <objc/objc-runtime.h>. That header is
          # one of the symlinks WebKitLibraries/SDKs/iphoneos18.0-additions.sdk/SymlinkedHeaders.xcfilelist
          # creates into $(WK_DERIVED_SDK_HEADERS_DIR)/usr/include from $(SDK_DIR_macosx)/usr/include/objc/.
          #
          # So the 18.0 tree supplies headers and stub libraries while IPHONEOS_DEPLOYMENT_TARGET stays
          # 16.1 and keeps setting the shipped minos. The symlink below is the load-bearing fix: the
          # derived name then resolves for every target that reads WK_ADDITIONAL_SDKS, with no dependence
          # on build-setting precedence. It exists only in the runner's clone, never in the repository.
          additions_tree=iphoneos18.0-additions.sdk
          deployment_target=$WK_BUILD_DEPLOYMENT_TARGET
          derived_name="iphoneos${deployment_target%%.*}.0-additions.sdk"
          sdk_root="$GITHUB_WORKSPACE/WebKit/WebKitLibraries/SDKs"

          assert_additions_sdk() {
            local path=$1 what=$2
            if [ ! -d "$path" ]; then
              echo "::error::missing additions SDK for IPHONEOS_DEPLOYMENT_TARGET=${deployment_target}: looked for ${path} (${what})"
              echo "WebKitLibraries/SDKs at this ref contains:"
              ls -1 "$sdk_root" 2>/dev/null || true
              exit 1
            fi
            if [ ! -d "$path/usr/local/include" ]; then
              echo "::error::additions SDK at ${path} (${what}) has no usr/local/include, so the objc headers cannot be produced"
              exit 1
            fi
          }

          assert_additions_sdk "$sdk_root/$additions_tree" "18.0 tree used as the link target"
          # -d follows symlinks, so an existing derived path that does not resolve lands here as a
          # dangling link rather than as a confusing ln failure; -L catches the dangling case, for
          # which test -e is false.
          if [ ! -d "$sdk_root/$derived_name" ] && { [ -e "$sdk_root/$derived_name" ] || [ -L "$sdk_root/$derived_name" ]; }; then
            echo "::error::${sdk_root}/${derived_name} exists but does not resolve to a directory"
            ls -l "$sdk_root/$derived_name"
            exit 1
          fi
          if [ "$derived_name" = "$additions_tree" ] || [ -d "$sdk_root/$derived_name" ]; then
            echo "derived additions SDK already present: $sdk_root/$derived_name"
          else
            ln -s "$additions_tree" "$sdk_root/$derived_name"
            echo "linked $sdk_root/$derived_name -> $additions_tree"
          fi
          assert_additions_sdk "$sdk_root/$derived_name" "derived path the build reads"
          if grep -qxF '$(SDK_DIR_macosx)/usr/include/objc/objc-runtime.h' \
              "$sdk_root/$derived_name/SymlinkedHeaders.xcfilelist"; then
            echo "objc/objc-runtime.h is listed in SymlinkedHeaders.xcfilelist"
          else
            echo "::warning::SymlinkedHeaders.xcfilelist under $derived_name does not list objc/objc-runtime.h"
          fi
          # The Build step names the same directory a second way, as a build setting rather than a
          # symlink; the path is computed from the clone so no runner-specific prefix is hardcoded.
          echo "WK_ADDITIONS_SDK_PATH=$sdk_root/$additions_tree" >> "$GITHUB_ENV"

      - name: Copy ABI shims
        run: |
          set -euo pipefail
          cp -R scripts WebKit/

      - name: Apply worktree patch
        if: inputs.apply_patch == 'true'
        env:
          WEBKIT_REF: ${{ inputs.webkit_ref }}
        run: |
          set -euo pipefail
          pwd
          ls -d patches scripts WebKit
          # patches/ios18-public-sdk-libpas-ulock-flags.patch guards PAS_USE_ULOCK_FLAGS_API,
          # which does not exist before tag Safari-18.2, so on an older ref the patch cannot
          # apply and a skip there is correct rather than stale.
          #
          # patches/ios18-public-sdk-pal-swift-include-paths.patch edits keys that only exist from
          # tag Safari-18.0 on, where the Swift PAL landed. A 16.x or 17.x ref has no
          # OTHER_SWIFT_FLAGS in PAL.xcconfig at all, so a skip there is correct for the same reason.
          #
          # patches/ios18-public-sdk-networkcontext-property.patch rewrites the _networkContext
          # declaration CFNetworkSPI.h gained in tag Safari-17.0, which is also the first ref whose
          # HAVE_NW_PROXY_CONFIG consumer in NetworkSessionCocoa.mm reads it. A 16.x ref has neither
          # the declaration nor a HAVE(NW_PROXY_CONFIG) block, so it has nothing to fix and a skip
          # there is correct rather than stale.
          #
          # patches/ios18-public-sdk-restricted-opener-domains.patch gates the
          # RestrictedOpenerDomainsController call in WebProcessPoolCocoa.mm. That class first
          # appeared in tag Safari-18.0: Safari-17.6-iOS-17.6 has neither the class in
          # WebPrivacyHelpers.h nor the registerNotifyCallback block that calls it. A 17.x or 16.x
          # ref therefore has nothing to gate and a skip there is correct rather than stale.
          # patches/ios18-public-sdk-extensionkit-extension-exclusion.patch edits
          # Source/WebKit/Configurations/BaseExtension.xcconfig. Safari-17.4 is the first tag that
          # has that file, and it keys the whole thing on USE_INTERNAL_SDK
          # (EXCLUDED_SOURCE_FILE_NAMES_ = *), so against the public SDK it already excludes every
          # source and needs no patch. Safari-17.6 is the first tag with the sdk-keyed
          # EXCLUDED_SOURCE_FILE_NAMES[sdk=iphone*] the patch rewrites. Safari-17.2 and 16.6 have no
          # such file at all, so a skip on those refs is correct rather than stale.
          #
          # patches/ios18-public-sdk-text-extraction-availability.patch annotates
          # WKTextExtractionRequest in Source/WebKit/WebKitSwift/TextExtraction/WKTextExtractionItem.swift.
          # Safari-18.0 is the first tag that ships WebKitSwift/TextExtraction at all; Safari-17.6,
          # 17.4, 17.2, 16.6 and 17.0 have no such directory, so a skip on those refs is correct
          # rather than stale. Safari-18.0 and 18.3.1 ship the file byte for byte identical, which
          # is why one patch covers both.
          #
          # patches/ios16-xpc-service-bundle-identifier.patch rewrites
          # PRODUCT_BUNDLE_IDENTIFIER[sdk=iphone*] in WebContentService.xcconfig,
          # NetworkService.xcconfig and GPUService.xcconfig. That gate is not in every tag: the
          # xcconfig at Safari-16.1, 16.4, 16.6, 17.0, 17.2, 17.3.1, 17.5 and 17.6 has no
          # sdk=iphone* PRODUCT_BUNDLE_IDENTIFIER line at all, so those refs already name the
          # services without the suffix and there is nothing to rewrite. Safari-17.4 has the gate
          # but keys it on sdk=iphonesimulator*, which a device build never matches. Safari-18.0,
          # 18.1, 18.1.1, 18.2, 18.3 and 18.3.1 all carry the sdk=iphone* line and all accept the
          # patch. Because the shape differs per tag, the guard below reads the three files
          # instead of comparing tag numbers.
          #
          # WKWebView.mm needs no change for the same reason the annotation is enough on the Swift
          # side: Source/WebKit/UIProcess/API/Cocoa/WKWebView.mm:5071-5107 includes the hand-written
          # Source/WebKit/UIProcess/Cocoa/WKTextExtractionItem.h, which carries no availability
          # annotation at all. The ObjC category therefore compiles at 16.1 with or without the
          # annotation on the Swift class (run 45078008945: 0 errors from any .mm), and adding
          # @available to the Swift declaration does not make the ObjC header's own declarations
          # unavailable. The same directory's WKWebView+TextExtraction.swift is entirely inside
          # #if canImport(UIIntelligenceSupport), false against this SDK, so it emits no
          # -primary-file job and no diagnostic.
          ref_needs_ulock_flags_api=0
          ref_has_pal_swift=0
          ref_needs_networkcontext_property=0
          ref_needs_restricted_opener_domains=0
          ref_needs_extensionkit_sdk_exclusion=0
          ref_has_webkit_swift_text_extraction=0
          ref_has_iphone_service_bundle_suffix=0
          ref_name="${WEBKIT_REF##*/}"
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2; minor = $3 }
              END {
                  if (major == "" || minor == "") exit 1
                  exit !((major + 0) > 18 || ((major + 0) == 18 && (minor + 0) >= 2))
              }' <<< "${ref_name}"; then
            ref_needs_ulock_flags_api=1
          fi
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2 }
              END {
                  if (major == "") exit 1
                  exit !((major + 0) >= 18)
              }' <<< "${ref_name}"; then
            ref_has_pal_swift=1
          fi
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2 }
              END {
                  if (major == "") exit 1
                  exit !((major + 0) >= 17)
              }' <<< "${ref_name}"; then
            ref_needs_networkcontext_property=1
          fi
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2 }
              END {
                  if (major == "") exit 1
                  exit !((major + 0) >= 18)
              }' <<< "${ref_name}"; then
            ref_needs_restricted_opener_domains=1
          fi
          # Safari-17.6 is the first tag whose BaseExtension.xcconfig keys the exclusion on sdk=.
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2; minor = $3 }
              END {
                  if (major == "" || minor == "") exit 1
                  exit !((major + 0) > 17 || ((major + 0) == 17 && (minor + 0) >= 6))
              }' <<< "${ref_name}"; then
            ref_needs_extensionkit_sdk_exclusion=1
          fi
          # Safari-18.0 is the first tag that ships WebKitSwift/TextExtraction at all.
          if awk -F'[-.]' '
              $1 != "Safari" { exit 1 }
              { major = $2 }
              END {
                  if (major == "") exit 1
                  exit !((major + 0) >= 18)
              }' <<< "${ref_name}"; then
            ref_has_webkit_swift_text_extraction=1
          fi
          # A ref whose three service configs still carry the .Service gate needs this patch; a
          # ref that has no such gate already names the services the way iOS asks for them.
          # Read from the files rather than from the tag, because the gate's presence is the fact
          # that decides whether the build produces the wrong identifier.
          for service in WebContentService NetworkService GPUService; do
            if grep -qF 'PRODUCT_BUNDLE_IDENTIFIER[sdk=iphone*] = $(PRODUCT_NAME).Service;' \
                "WebKit/Source/WebKit/Configurations/${service}.xcconfig" 2>/dev/null; then
              ref_has_iphone_service_bundle_suffix=1
            fi
          done
          echo "PAS_USE_ULOCK_FLAGS_API present in ${WEBKIT_REF}: ${ref_needs_ulock_flags_api}"
          echo "PAL Swift module present in ${WEBKIT_REF}: ${ref_has_pal_swift}"
          echo "_networkContext declaration present in ${WEBKIT_REF}: ${ref_needs_networkcontext_property}"
          echo "RestrictedOpenerDomainsController present in ${WEBKIT_REF}: ${ref_needs_restricted_opener_domains}"
          echo "BaseExtension.xcconfig keys exclusion on sdk= in ${WEBKIT_REF}: ${ref_needs_extensionkit_sdk_exclusion}"
          echo "WebKitSwift text extraction present in ${WEBKIT_REF}: ${ref_has_webkit_swift_text_extraction}"
          echo "iPhone service bundle identifiers carry the .Service suffix in ${WEBKIT_REF}: ${ref_has_iphone_service_bundle_suffix}"
          for p in patches/*.patch; do
            test -f "$p" || { echo "MISSING PATCH FILE: $p"; exit 1; }
            echo "== $p"
            # 16.x worktree patches only match their own tag. The ios18-public-sdk patches fix
            # missing guards that affect every tag built against the public iOS SDK, so a skip there
            # means the patch is stale and the build would fail 90 minutes later.
            if ! git -C WebKit apply --check -v "$PWD/$p"; then
              case "$(basename "$p")" in
                ios18-public-sdk-libpas-ulock-flags.patch)
                  if [ "$ref_needs_ulock_flags_api" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-pal-swift-include-paths.patch)
                  if [ "$ref_has_pal_swift" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-networkcontext-property.patch)
                  if [ "$ref_needs_networkcontext_property" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-restricted-opener-domains.patch)
                  if [ "$ref_needs_restricted_opener_domains" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-extensionkit-extension-exclusion.patch)
                  if [ "$ref_needs_extensionkit_sdk_exclusion" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-text-extraction-availability.patch)
                  if [ "$ref_has_webkit_swift_text_extraction" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios16-xpc-service-bundle-identifier.patch)
                  # No .Service gate at this ref: the build already names the services without
                  # the suffix (every 16.x and 17.x tag, and 17.4 where the gate keys on
                  # iphonesimulator instead). Nothing to patch, so a skip is correct.
                  if [ "$ref_has_iphone_service_bundle_suffix" = 1 ]; then
                    echo "REQUIRED PATCH DOES NOT APPLY: $p"
                    exit 1
                  fi
                  ;;
                ios18-public-sdk-*)
                  echo "REQUIRED PATCH DOES NOT APPLY: $p"
                  exit 1
                  ;;
              esac
              echo "SKIP (does not apply to ${WEBKIT_REF}): $p"
              continue
            fi
            git -C WebKit apply -v "$PWD/$p"
            echo "APPLIED: $p"
          done

      - name: Check the PAL Swift include paths expand at the shipped deployment target
        if: inputs.apply_patch == 'true'
        run: |
          set -euo pipefail
          # patches/ios18-public-sdk-pal-swift-include-paths.patch is what puts the two -I flags
          # into OTHER_SWIFT_FLAGS at this deployment target. Resolving the key chain here proves
          # that before the build spends an hour reaching PAL, instead of failing on
          # "no such module 'PALSwift'" in CryptoKitShim.swift. The script prints the expanded
          # WK_IOS_17 and OTHER_SWIFT_FLAGS, so a regression shows the keys it resolved.
          python3 scripts/check-pal-swift-include-paths.py \
            --pal-xcconfig WebKit/Source/WebCore/PAL/Configurations/PAL.xcconfig \
            --conditionals-xcconfig WebKit/Configurations/WebKitTargetConditionals.xcconfig \
            --deployment-target "$WK_BUILD_DEPLOYMENT_TARGET"

      - name: Check the ExtensionKit exclusion follows the deployment-target switch
        if: inputs.apply_patch == 'true'
        run: |
          set -euo pipefail
          # patches/ios18-public-sdk-extensionkit-extension-exclusion.patch makes
          # BaseExtension.xcconfig read WK_EXTENSIONKIT_EXTENSIONS_EXCLUDED, which the Build step
          # sets. Both directions are asserted here, against the ref's own file, for both paired
          # settings: with the switch set the four ExtensionKit targets must compile nothing and
          # carry no bridging header, and with it unset the file must keep the upstream values, so a
          # ref that reshapes these keys cannot silently change ordinary iOS builds that leave the
          # switch alone.
          python3 scripts/check-extensionkit-exclusion.py \
            --base-extension-xcconfig WebKit/Source/WebKit/Configurations/BaseExtension.xcconfig \
            --sdk "iphoneos$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 18.5)" \
            --excluded-switch "$WK_EXTENSIONKIT_EXTENSIONS_EXCLUDED"
          # The default direction: a build that leaves the switch alone must still compile these
          # targets with their bridging header, so the patched file has to resolve to the upstream
          # values.
          python3 scripts/check-extensionkit-exclusion.py \
            --base-extension-xcconfig WebKit/Source/WebKit/Configurations/BaseExtension.xcconfig \
            --sdk "iphoneos$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 18.5)" \
            --excluded-switch ""

      - name: Check every WebKitSwift text-extraction type is gated for the types it references
        if: inputs.apply_patch == 'true'
        run: |
          set -euo pipefail
          # patches/ios18-public-sdk-text-extraction-availability.patch annotates
          # WKTextExtractionRequest, which has no @available of its own but names
          # WKTextExtractionItem in its stored completion handler, its init and fulfill(item:).
          # WKTextExtractionItem is @available(iOS 17.0, macOS 12.0, *), so a 16.1 deployment
          # target reaches those three sites and Swift rejects each one:
          #
          #   WKTextExtractionItem.swift:126:38: error: 'WKTextExtractionItem' is only available
          #   in iOS 17.0 or newer        (build.log of run 45078008945, also :128:78 and :133:47)
          #
          # Upstream never saw this because WebKitSwift did not compile below 17.0 until this
          # build lowered IPHONEOS_DEPLOYMENT_TARGET to 16.1, so the annotation was never needed.
          #
          # The script reads the patched file rather than matching the one line, so a future ref
          # that adds a declaration cannot reintroduce the error silently. Tags before Safari-18.0
          # ship no WebKitSwift/TextExtraction directory and print SKIP.
          python3 scripts/check-text-extraction-availability.py \
            --swift WebKit/Source/WebKit/WebKitSwift/TextExtraction/WKTextExtractionItem.swift

      - name: Configure embedded development
        run: sudo WebKit/Tools/Scripts/configure-xcode-for-embedded-development || true

      - name: Probe actool
        continue-on-error: true
        run: |
          set -uo pipefail
          actool=/Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool
          src="$PWD/WebKit/Source/WebKit"
          out="$RUNNER_TEMP/actool-real"
          rm -rf "$out"
          mkdir -p "$out"
          echo "== help excerpt for export options"
          "$actool" --help 2>&1 | grep -iE "export|depend|thin|symbol" | head -20 || true
          echo "== without the xcodebuild-only flags"
          "$actool" \
            "$src/HTTPSBrowsingWarning.xcassets" \
            "$src/Resources/ios/iOS.xcassets" \
            "$src/Resources/SafeBrowsing.xcassets" \
            --compile "$out" \
            --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist "$RUNNER_TEMP/actool-real.plist" \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device iphone \
            --minimum-deployment-target 18.5 \
            --platform iphoneos
          echo "actool real exit: $?"
          ls "$out" | head

      - name: Build
        run: |
          set -uo pipefail
          cd WebKit
          # build-webkit drives xcodebuild directly, so IDE defaults do not reach it; Xcode's own
          # scheduling already spreads work across ~3 cores natively.
          echo "ccache statistics before build:"
          ccache -s || true
          # Independent sampler: survives whatever kills the build shell.
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          # The capacity report before Save subtracts this snapshot's Cleanups from the
          # post-build one, because that counter accumulates for the life of the cache
          # directory and only the difference describes this build.
          ccache --show-stats --verbose > "$GITHUB_WORKSPACE/diagnostics/ccache-before.txt" || true
          sampler="$GITHUB_WORKSPACE/diagnostics/samples.log"
          ( while true; do
              printf '%s ' "$(date -u +%FT%TZ)"
              sysctl -n vm.swapusage 2>/dev/null | tr '\n' ' '
              printf 'procs=%s ' "$(ps -Ao rss -r 2>/dev/null | awk 'NR>1{s+=$1} END{print s+0}')"
              printf 'top=%s\n' "$(ps -Ao rss,comm -r 2>/dev/null | sed -n 2p | tr ' ' '_')"
              sleep 15
            done ) > "$sampler" 2>&1 &
          sampler_pid=$!
          echo "sampler pid ${sampler_pid}"
          status=0
          # The device deb must load on iOS 16.1, so every shipped binary has to be built
          # for 16.1 against the 18.5 SDK. Without IPHONEOS_DEPLOYMENT_TARGET the SDK's own
          # minimum leaks into LC_BUILD_VERSION, and dyld then refuses the framework with
          # "built for iOS 18.5 which is newer than running OS".
          #
          # Source/WebKit/Configurations/WebKit.xcconfig:227-244 is where the 18.5-SDK build
          # decides to link BrowserEngineKit strongly and WritingTools weakly; blanking both
          # keys removes those -framework flags. Blanking the flags alone is not enough:
          # Source/WTF/wtf/PlatformUse.h:411-417 turns the two USE macros on from
          # __IPHONE_OS_VERSION_MAX_ALLOWED >= 170400 and __has_include(<BrowserEngineKit/...>),
          # both of which still hold under an 18.5 SDK, so -DUSE_BROWSERENGINEKIT=0 and
          # -DUSE_EXTENSIONKIT=0 close the gate. Only those two macros are forced here;
          # HAVE_BROWSER_ENGINE_SUPPORTING_API is left to PlatformHave.h, for the reason below.
          #
          # HAVE_BROWSER_ENGINE_SUPPORTING_API is deliberately NOT defined on the command line.
          # PlatformHave.h:1717-1724 computes it from __IPHONE_OS_VERSION_MAX_ALLOWED >= 170400,
          # which is 180500 under the 18.5 SDK, so it comes out 1. That is the value that matches
          # the SDK, and it is what the four affected sites need, because the 18.5 SDK declares
          # each of these APIs itself. The three typed ones are API_AVAILABLE(ios(17.4)), the same
          # boundary PlatformHave.h uses; the ledger enum carries no availability annotation and
          # is simply present in the 18.5 IOSurfaceRef.h:
          #   IOSurfaceRef.h:452 declares IOSurfaceMemoryLedgerTags, so forcing the macro to 0 made
          #   Source/WTF/wtf/spi/cocoa/IOSurfaceSPI.h:100 declare it a second time. That is the
          #   redefinition that stopped run 44951295826.
          #   UIScrollView.h:105,110 declare bouncesHorizontally and bouncesVertically, so forcing 0
          #   made Source/WebKit/Platform/spi/ios/UIKitSPI.h:467 re-declare them inside
          #   @interface UIScrollView (), which clang rejects as an illegal redeclaration.
          #   AVContentKeySession.h:795 declares AVExternalContentProtectionStatus, so forcing 0 made
          #   Source/WebCore/PAL/pal/spi/cocoa/AVFoundationSPI.h:250 re-declare that NS_ENUM.
          #   AVVideoPerformanceMetrics.h is a public 18.5 header, so forcing 0 made
          #   AVFoundationSPI.h:408 re-declare the whole @interface.
          # With the macro absent, all four take the SDK branch and the three SPI headers stop
          # duplicating the SDK. patches/ios18-public-sdk-iosurface-memory-ledger-tags.patch keeps
          # that first site correct for anyone who does still force the macro to 0.
          # Those last three sites were never compiled in run 44951295826: WebGPU stopped first and
          # the PAL, WebCore and WebKit targets reached no CompileC at all.
          #
          # The metrics properties the 18.5 SDK gained are API_UNAVAILABLE(macos, ios, tvos, visionos),
          # so with the macro at 1 the SDK branch is selected but the properties stay unusable on iOS.
          # The existing patches keep every one of those properties out of the compiled iOS code, so
          # no call site reaches them: VideoMediaSampleRenderer.mm:463,474,485,496 and
          # MediaPlayerPrivateAVFoundationObjC.mm:3904 return early under PLATFORM(IOS_FAMILY),
          # MediaPlayerPrivateMediaSourceAVFObjC.mm:938 does the same, and
          # LocalSampleBufferDisplayLayer.mm:412 swaps the metrics log line for a shorter one that
          # reads no property and falls through. Those patches must stay.
          #
          # WK_VERSIONED_SDK_ADDITIONS_PATH is the second half of the additions-SDK fix, alongside
          # the iphoneos16.0 -> iphoneos18.0 symlink in the step above. Configurations/
          # WebKitProjectPaths.xcconfig:97 sets that key from WK_VERSIONED_SDK_ADDITIONS_PATH_$(USE_INTERNAL_SDK),
          # and Configurations/SDKAdditions.xcconfig:35-39 copies it into WK_ADDITIONAL_SDKS, which
          # Source/WebKit/Configurations/Base.xcconfig:111 renames to ADDITIONAL_SDKS. build-webkit
          # hands every KEY=VALUE argument to xcodebuild unchanged (Tools/Scripts/build-webkit:370-381
          # pass @ARGV into buildXcodeScheme / buildXCodeProject, and Tools/Scripts/webkitdirs.pm:2358,2368
          # pass them on as xcodebuild arguments), and a command-line setting beats the xcconfig that
          # assigns it. So this key pins the path even if a future ref stops naming the directory after
          # the deployment target. The symlink alone would be enough; this makes the intent explicit.
          #
          # OTHER_TAPI_FLAGS repeats the two -D values because GenerateTAPI parses those headers
          # with its own clang run, which inherits neither OTHER_CFLAGS nor OTHER_CPLUSPLUSFLAGS.
          # WebKit.xcconfig:286 adds -Xparser -include -Xparser config.h, so the parse reads
          # PlatformUse.h:411-413 and turns USE_EXTENSIONKIT back on from
          # __IPHONE_OS_VERSION_MAX_ALLOWED >= 170400, which the 18.5 SDK satisfies. The parse
          # then sees 1 where the binary was built with 0. Run 45020788469 ended in exactly that,
          # at GenerateTAPI for WebKit.framework/WebKit.tbd, reporting only WKGrant and
          # WKProcessExtension, from ExtraPrivateSymbolsForTAPI.h:45 and :48. Of the headers
          # WebKit.xcconfig:284 lists as -extra-private-header and -extra-public-header, that one
          # is the only one carrying a USE() gate; XPCEndpoint.h, XPCEndpointClient.h and
          # ExtraPublicSymbolsForTAPI.h carry none.
          #
          # Fixing headers instead would mean judging that per declaration and re-judging it as
          # refs move: fifteen headers read USE(EXTENSIONKIT), thirteen through a bare #if and two
          # through a compound one, and six read USE(BROWSERENGINEKIT). The -D does reach the
          # parse: in tapi (tapi-1600.0.11.8, b824911e) Options.cpp:1083-1094 collects unclaimed
          # -D into frontendOptions.macros, InstallAPIDriver.cpp:662 copies them to job.macros,
          # and Frontend.cpp:385-391 appends each as -D before :444-446 appends clangExtraArgs,
          # where -Xparser -include config.h lands; PlatformUse.h:411 tests !defined, so order
          # does not matter. $(inherited) keeps the -extra-private-header list from
          # WebKit.xcconfig:284 and the -Xparser flags from :286.
          Tools/Scripts/build-webkit --ios-device --release --use-ccache \
            WK_USE_CCACHE=YES \
            ARCHS='arm64e' \
            IPHONEOS_DEPLOYMENT_TARGET="$WK_BUILD_DEPLOYMENT_TARGET" \
            WK_EXTENSIONKIT_EXTENSIONS_EXCLUDED="$WK_EXTENSIONKIT_EXTENSIONS_EXCLUDED" \
            WK_VERSIONED_SDK_ADDITIONS_PATH="$WK_ADDITIONS_SDK_PATH" \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error -DUSE_BROWSERENGINEKIT=0 -DUSE_EXTENSIONKIT=0' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-error -DUSE_BROWSERENGINEKIT=0 -DUSE_EXTENSIONKIT=0' \
            OTHER_TAPI_FLAGS='$(inherited) -DUSE_BROWSERENGINEKIT=0 -DUSE_EXTENSIONKIT=0' \
            WK_BROWSERENGINEKIT_LDFLAGS= \
            WK_WRITING_TOOLS_LDFLAGS_iphoneos= \
            COMPRESS_PNG_FILES=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            WK_ROOTLESS_FRAMEWORKS=YES > "$GITHUB_WORKSPACE/diagnostics/build.log" 2>&1 || status=$?
          echo "build-webkit exited with status ${status}"
          kill "$sampler_pid" 2>/dev/null || true
          echo "ccache statistics after build:"
          ccache -s || true
          if [ "$status" -ne 0 ]; then
            echo "=== last 60 lines of build output"
            tail -60 "$GITHUB_WORKSPACE/diagnostics/build.log" || true
            echo "=== memory"
            sysctl -n hw.memsize vm.swapusage 2>/dev/null || true
            vm_stat 2>/dev/null | head -12 || true
            ps -Ao rss,comm -r 2>/dev/null | head -15 || true
            echo "=== sampler tail"
            tail -20 "$sampler" || true
            echo "=== actool probe"
            /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/actool --version --output-format xml1 || true
          fi
          exit "$status"

      - name: Assert iOS 16.1 deployment gates
        if: success()
        run: |
          set -euo pipefail
          # Fails the job when a shipped binary asks for a newer minos than 16.1 or still
          # carries a BrowserEngineKit load command, so a gate regression cannot turn into
          # another deb that dyld refuses to load on the device.
          zsh scripts/check-ios-deployment-gates.sh \
            --build-dir "$PWD/WebKit/WebKitBuild/Release-iphoneos" \
            --max-minos 16.1

      - name: Report ccache compression
        if: always()
        run: |
          # --show-compression walks every file in the cache, so it runs once here and the
          # capacity step below reads this transcript instead of asking for it again.
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          ccache --show-compression 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/ccache-compression.txt" || true

      - name: Report ccache capacity
        if: always()
        run: |
          set -uo pipefail
          # One line, read-only, and the number to compare across builds. RESIDENT means this
          # build trimmed nothing and ended below 98% of max_size; anything else means the
          # working set still does not fit. in-run-hit is the share of this build's cacheable
          # calls that the restored cache answered, which is the number that should rise once
          # max_size stops forcing trims.
          compression_report="$GITHUB_WORKSPACE/diagnostics/ccache-compression.txt"
          baseline="$GITHUB_WORKSPACE/diagnostics/ccache-before.txt"
          # Either file is missing only when an earlier step failed before writing it;
          # without --baseline the script judges saturation alone, and without the
          # transcript it runs ccache itself.
          args=()
          [ -f "$baseline" ] && args+=(--baseline "$baseline")
          [ -f "$compression_report" ] && args+=(--compression "$compression_report")
          # macOS /bin/bash is 3.2, where "${args[@]}" on an empty array under `set -u` aborts
          # the step during word expansion, so `|| true` cannot catch it. The +"..." form
          # expands to nothing when the array is unset or empty and to the quoted elements
          # otherwise, which is safe on both 3.2 and 5.x.
          python3 scripts/report-ccache-capacity.py ${args[@]+"${args[@]}"} || true

      - name: Inspect build output
        if: always()
        run: |
          set -uo pipefail
          df -h /
          du -sh WebKit/WebKitBuild 2>/dev/null || true
          ls -la WebKit/WebKitBuild/Release-iphoneos 2>/dev/null | head -40 || echo "no Release-iphoneos"
          echo "=== link commands carrying -dyld_env"
          found=0
          while IFS= read -r f; do
            if grep -q 'dyld_env' "$f"; then
              echo "LINKFLAG: $f"
              found=1
            fi
          done < <(find WebKit/WebKitBuild/Release-iphoneos -name '*.LinkFileList' 2>/dev/null)
          if [ "$found" = 0 ]; then
            echo "no LinkFileList mentions dyld_env"
          fi
          echo "=== XPC services carrying an LC_DYLD_ENVIRONMENT load command"
          for b in WebKit/WebKitBuild/Release-iphoneos/*.xpc/* WebKit/WebKitBuild/Release-iphoneos/WebKit.framework/XPCServices/*.xpc/*; do
            [ -f "$b" ] || continue
            if otool -l "$b" 2>/dev/null | grep -q 'cmd LC_DYLD_ENVIRONMENT'; then
              echo "DYLD_ENV FOUND: $b"
              otool -l "$b" 2>/dev/null | grep -A3 'cmd LC_DYLD_ENVIRONMENT' | sed 's/^/    /'
            fi
          done
          echo "=== end of inspection"

      - name: Prune build intermediates
        if: always()
        run: |
          set -euo pipefail
          # Crash reports explain a silent kill; upload them out of the VM before it goes away.
          mkdir -p diagnostics
          cp -R ~/Library/Logs/DiagnosticReports diagnostics/ 2>/dev/null || true
          du -sh WebKit/WebKitBuild/*.build 2>/dev/null | sort -h | tail -10 || true
          # This runs before Save ccache, not after, because Save needs the room. Run
          # 45078008945 left 7.2 GiB free at the end of the build and held 28 GB in
          # WebKit/WebKitBuild, of which *.build was about 22.9 GiB (the du above: 10G
          # WebCore.build, 8.2G WebKit.build, 2.2G JavaScriptCore.build, and 1.9 GiB across the
          # rest). At max_size 10G the cache grows 3.79 GiB further than the 6G run did, so
          # without this the save would start with 7.2 - 3.79 = 3.4 GiB free and need about
          # 9.4 GiB for the archive, a 6.0 GiB shortfall. actions/cache only warns when tar
          # fails, so the step would stay green and the whole generation would be lost. After
          # this rm the same run had 30 GiB free, which is 26.3 GiB once the larger cache is
          # counted, leaving 16.9 GiB of headroom. Nothing Inspect scans lives here: its
          # LinkFileList search is rooted at WebKitBuild/Release-iphoneos, while every
          # LinkFileList xcodebuild writes sits under *.build/Release-iphoneos/*.build
          # (build.log has 68 distinct paths, all under *.build).
          rm -rf WebKit/WebKitBuild/*.build 2>/dev/null || true
          # Kept so the next run's log shows the headroom Save had, which is the number that
          # decides whether a larger max_size is affordable.
          df -h /

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Install packaging tools
        if: success()
        run: |
          set -euo pipefail
          brew install ldid dpkg || true
          command -v ldid && command -v dpkg-deb

      - name: Package rootless deb
        if: success()
        run: |
          set -euo pipefail
          zsh scripts/package-webkit-device-deb.sh \
            --product "$PWD/WebKit/WebKitBuild/Release-iphoneos" \
            --rootless \
            --output "$PWD/packages/webkit-rootless.deb"
          ls -lh packages/

      - name: Assert the packaged XPC services carry the identifiers iOS asks for
        if: success()
        run: |
          set -euo pipefail
          # A package whose bundles are still named com.apple.WebKit.WebContent.Service is
          # unusable on the device: Source/WebKit/UIProcess/Launcher/cocoa/ProcessLauncherCocoa.mm
          # asks for com.apple.WebKit.WebContent with no suffix, so our service is never selected
          # and every fix underneath it stays invisible. Checking here fails the run instead of
          # shipping a deb that only reveals the problem after it is installed.
          python3 scripts/check-xpc-service-bundle-identifiers.py --deb "$PWD/packages/webkit-rootless.deb" || {
            echo "This deb ships XPC services iOS never selects, so installing it replaces nothing."
            echo "Either a bundle is missing (see the FAIL lines above) or one still carries the"
            echo ".Service suffix. On a Safari-18.x ref the suffix means"
            echo "patches/ios16-xpc-service-bundle-identifier.patch did not reach the build;"
            echo "this run had apply_patch=${{ inputs.apply_patch }}."
            exit 1
          }
          # The checker reads plists out of ar and tar, so the cases that pin both directions need
          # no build artifact and no dpkg-deb; running them here keeps the checker itself honest.
          python3 scripts/test-check-xpc-service-bundle-identifiers.py

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-rootless-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
